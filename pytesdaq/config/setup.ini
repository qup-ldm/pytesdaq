####################################################################
#
# Run configuration (hardware, ADC connections, wiring)
#
# Each run the following parameters need to be modified:
#    - fridge_run = # 
#    - fridge_run_start = mm/dd/yyyy HH:MM
#      (time the fridge was at base) 
#    - controllers if changed
#    - ADC connection
#        - connection# = ... (see example below)
#
# ##################################################################


[setup] 

# Facility number: 1 = McKinsey Leiden Fridge, 2 = Pyle Cryoconcept Fridge,
#                  3 = UMass  4 = LBL Blue Fors   5 = Kamioka
facility = 5

# Fridge run number and  date/time fridge was at base temperature
# (syntax: mm/dd/yyyy HH:MM)
fridge_run = 20
fridge_run_start = 10/27/2026 17:00

# raw data base path (run# directory automatically   created)
#data_path = /mnt/synology/Data
data_path = .

# INSTRUMENTS controllers
#tes_controller = keithley2400
#tes_controller = rigolDG852
#signal_generator = rigolDG852
tes_controller = lakeshoreM81
signal_generator = lakeshoreM81
laser_signal_generator = rigolDG852

# instruments or driver not available, keep commented
# squid_controller = starcryo 
# temperature_controllers = lakeshore


# ADC list
enable_adc = adc1

# database (FIXME -> Not implemented yet)
enable_redis = false
enable_sql = false

# readback instrument values (FIXME -> Not implemented yet)
enable_readback = false



[adc1]
device_name  = Dev1

# default adc settings
# (may be changed with run_daq.py arguments!)
sample_rate = 1250000 
nb_samples = 125000
voltage_min = -10
voltage_max = 10
channel_list = 0-3
trigger_type = 1
trigger_channel = pfi0


# NI ADC connection information
# connection# (# ADC channel 0-7) = ...
#      Controller ->  "controller:[name]_[channel]"
#      TES wiring ->  "tes:[channel]  (optional if same as controller channel)
#      Detector   ->  "detector:[name]_[channel]"  (set to "None" if no parameter
connection0 = detector:TES1, controller:starcryo1_1
connection1 = detector:TES2, controller:starcryo1_2
connection2 = detector:TES3, controller:starcryo1_3
connection3 = detector:TES4, controller:starcryo1_4
connection4 = detector:empty, controller:starcryo1_5
connection5 = detector:empty, controller:starcryo1_6
#connection6 = detector:MV4_1E4_E_4pc, controller:starcryo1_7
#connection7 = detector:MV4_1I5_veto, controller:starcryo1_8
#connection6 = detector:PCB_AccelX, controller:NONE_7
#connection7 = detector:rigolTTL,  controller:ttl_ttl

#  Electronics and detector readout configuration if not set by SQUID/TES/SG controllers
# 
#  shunt_resistance [Ohms] 
#  squid_turn_ratio  shunt_resistance: 0.002, squid_turn_ratio:10, feedback_resistance:100000
#  feedback_resistance [Ohms] (magnicon->not needed, read from board)
#  parasitic_resistance [Ohms] (if known)MV4
#  tes_bias_resistance: [Ohms]
#  output_gain (for close/open loop calculation)
#  preamp_gain (for open loop calculation)
#  signal_gen_resistance: [Ohms]  -> resistance in the TES line
#     

detector_config0 = tes_bias_resistance: 997.6, signal_gen_resistance: 997.6, output_gain: 1, shunt_resistance: 0.002, squid_turn_ratio:10, feedback_resistance:100000
detector_config1 = tes_bias_resistance: 998.48, signal_gen_resistance: 998.48, output_gain: 1, shunt_resistance: 0.002, squid_turn_ratio:10, feedback_resistance:100000
detector_config2 = tes_bias_resistance: 1012.21, signal_gen_resistance: 1012.21, output_gain: 1, shunt_resistance: 0.002, squid_turn_ratio:10, feedback_resistance:100000
detector_config3 = tes_bias_resistance: 1001.8, signal_gen_resistance: 1001.8, output_gain: 1, shunt_resistance: 0.002, squid_turn_ratio:10, feedback_resistance:100000
detector_config4 = tes_bias_resistance: 2047, signal_gen_resistance: 2047, output_gain: 1, shunt_resistance: 0.002, squid_turn_ratio:10, feedback_resistance:100000
detector_config5 = tes_bias_resistance: 2047, signal_gen_resistance: 2047, output_gain: 1, shunt_resistance: 0.002, squid_turn_ratio:10, feedback_resistance:100000
#detector_config6 = tes_bias_resistance: 2047, signal_gen_resistance: 2047, output_gain: 1, shunt_resistance: 0.002, squid_turn_ratio:10, feedback_resistance:100000
#detector_config7 = tes_bias_resistance: 2047, signal_gen_resistance: 2047, output_gain: 1, shunt_resistance: 0.002, squid_turn_ratio:10, feedback_resistance:100000

[polaris_daq]
lib = /home/ldmdaq/nidaq/lib/libnidaq.so
fcn = NIdaq
enable = true 
next = recorder


[polaris_recorder]
lib = /home/ldmdaq/nidaq/lib/libnidaq.so
fcn = HDF5Recorder
enable = true
next = daq

[agilent33500B]
#visa_address = TCPIP::131.243.51.44::inst0::INSTR
visa_address = TCPIP::192.168.10.1::inst0::INSTR
attenuation = 1.0

[keithley2400]
visa_address = ASRL3::INSTR
voltage_source = true

[lakeshoreM81]
# Lakeshore M81 current source (BCS-10/CS-10) used as TES bias (DC offset)
# and dIdV signal generator (square wave on top of the bias)
# serial (USB) connection, or "ip = ..." / "tcp_port = 7777" for ethernet
com_port = /dev/ttyUSB0
baud_rate = 921600
# source module slot: 1-3 (S1-S3)
source_slot = 1
# false: currents set directly on the current source (TES bias in uA,
#        dIdV mV amplitude converted once with signal_gen_resistance)
# true:  driven like a voltage generator (V / load resistance)
voltage_source = false

[rigolDG852]
visa_address = TCPIP::192.168.10.2::INSTR
voltage_source = true

[temperature_controllers]
# Lakeshore

# TCP or USB information
lakeshore_setup  =  model:372, ip:192.168.2:11, tcp_port:7777

# channel setup
# Format:
#    lakeshore_chan[1-16] = name:[unique name], type:[RX, CX, or FR], serial:[...]
#    "type" and "serial" are optional is resistance only measurement or temperature
#    curve loaded in lakeshore
# lakeshore_chan1 = name:TES1, global_number:1
# lakeshore_chan2 = name:MF3, global_number:2
# lakeshore_chan3 = name:MF2, global_number:3
# lakeshore_heater0 = name:heaterMCls, global_number:30



[redis]
enable = false
host = 127.0.0.1
port = 6379
password = None
data_stream = NIstream
