[iv_didv]

daq_driver = polaris

# TES bias IV/dIdV

# sleep time [seconds] (after the bias has reached the new point)
tes_bias_change_sleep_time = 0

# TES bias ramp: soft transition between bias points to avoid SQUID jumps.
# The bias is changed from its present value to the next point in equal
# increments no larger than "tes_bias_ramp_step" (same unit as the sweep:
# uA if bias_in_ua = true, mV otherwise), waiting "tes_bias_ramp_step_time"
# seconds between increments (ramp rate = step / step_time).
# The first bias point of the sweep (and the TES zap) is set directly, no ramp.
use_tes_bias_ramp = false
tes_bias_ramp_step = 0.1
tes_bias_ramp_step_time = 0.2

# SQUID rail guard: before/after each run, read the
# baselines; if any |V| > rail_fraction x ADC voltage
# range of the measurement, reset SQUIDs (all channels,
# PCS102 remote, setup.ini [pcs102_remote]) and re-check.
# A run that railed is kept and retaken once.
rail_guard = true
rail_fraction = 0.75
# number of traces (5000 samples) read per check
rail_nb_traces = 10
# max resets per check, wait after reset [s]
rail_max_resets = 2
rail_reset_wait = 0.5

# Negative bias
use_negative_tes_bias = false

# TES bias sweep: use vect OR  min/max/step 
use_tes_bias_vect = false

#Units: if not in microamps, then mV is assumed
bias_in_ua = true

# bias vect [mV]
#tes_bias_vect = 100, 50,20,10,5,1

# min/max/steps [all in mV]
# 100x25: 400,0,80,20,40,5,5
# 800x200: 2000,0,400,100,200,25,25
# 1%: 1500,0,250,75,250,15,15
# Ch1 4%: 2000,0,1000,250,250,30,25
# Ch4 4%: 400,0,200,50,50,6,5


#Run 24 modification for the SQUID tests [all in mV]
tes_bias_max = 100
tes_bias_min = 0
tes_bias_T = 60
tes_bias_SC = 10
tes_bias_step_N = 10
tes_bias_step_T = 5
tes_bias_step_SC = 1



# Temperature sweep, temperature in mk
iv_didv_temperature_sweep = false

# thermometer/heater name or global number (defined in setup.ini)
# thermometer_global_num = 11
# heater_global_num = 11
thermometer_name = MC
heater_name = heaterMC


use_temperature_vect = false		
temperature_vect = 15,20
#temperature_min = 0
#temperature_max = 0
#temperature_step = 0

# wait time [min]
temperature_stable_wait_time=5
temperature_max_wait_time = 15
temperature_tolerance_percent = 0.4



[iv]
# sample rate 
sample_rate = 1250000

# run time in seconds
run_time = 10

# trace length:

# trace length in "ms" or "adc"
# trace_length_adc = 8192 
trace_length_ms = 100

# voltage range
voltage_min = -10
voltage_max = 10

 


[didv]
# If different value for Rp,Rn-> add section with variables 
# that needs to be changed

# take dIdV data one channel out a time or together
loop_channels = false 

# run time in seconds
run_time = 40

# ADC setup

# sample rate [Hz]
sample_rate = 1250000

# number of cycles test signal -> trace length
nb_cycles = 4.1

# voltage range
voltage_min = -10
voltage_max = 10

# signal generator
# amplitude in mVpp
signal_gen_voltage = 2

# frequency in Hz
signal_gen_frequency = 80

# shape: 1= square, 2=sine, 3=triangle, 4 = arbitrary waveform
signal_gen_shape = 1



[rn]

# Rn TES bias [uA]
tes_bias = 400

# any parameters in this section supersede dIdV parameters
signal_gen_voltage = 100 
voltage_min = -2

