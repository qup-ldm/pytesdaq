########################################################
#
# Data taking configuration
#
# 3 types: continuous, randoms, didv
#
# Usage example, 2 hours continuous data:
#
#    python bin/run_daq.py -c A,B,D --acquire-cont
#           --duration 2h --comment "this is a comment"
#           --run_purpose test
#
########################################################


[continuous] 

# single series max time in seconds(s) or minutes (m)
# if run "duration" longer than series max time
# then run is splitted in multiple series
# number of series within group = total duration / series max time
series_max_time = 30m

# split open/restricted series (for blinding purpose)
split_series = False

# trace length in millisec (ms) or  seconds (s)
# Alternatively use "nb_samples"
trace_length = 10s

# sample rate
sample_rate = 1250000

# voltage min/max
voltage_min = -5
voltage_max = 5

# SQUID rail guard (see pytesdaq/utils/rail_guard.py):
# before/after each series, reset SQUIDs (PCS102 remote)
# if any channel |baseline| > rail_fraction x voltage range
rail_guard = true
rail_fraction = 0.75
rail_nb_traces = 10
rail_max_resets = 2
rail_reset_wait = 0.5

# Beginning/end of series calib (configuration in "calibration" field)
add_series_start_calib = False
add_series_end_calib = False
calib_run_time = 5m


# Beginning/end of series didv (configuration in "didv" field)
add_series_start_didv = False
add_series_end_didv = False
didv_run_time = 40s
#didv_detector_channels = Mv41pcRadLeft, Mv41pcRadRight,Mv41pcNormLeft, Mv41pcNormRight
#didv_detector_channels = TES800x200ArB,TES800x200XeA,TES800x200XeB


# Beginning/end of series iv (configuration in "iv" field)
add_series_start_iv = False
add_series_end_iv = False
iv_run_time = 10s
#iv_detector_channels = Mv3025pcBigFinsLeft,Mv3025pcRegularLeft,Mv3025pcRegularRight


[randoms] 

# maximum series time
series_max_time = 10m

# trace length in millisec (ms) or  seconds (s)
# Alternatively use "nb_samples"
trace_length = 50ms

# sample rate
sample_rate = 1250000

# voltage min/max
voltage_min = -5
voltage_max = 5

# SQUID rail guard (see pytesdaq/utils/rail_guard.py):
# before/after each series, reset SQUIDs (PCS102 remote)
# if any channel |baseline| > rail_fraction x voltage range
rail_guard = true
rail_fraction = 0.75
rail_nb_traces = 10
rail_max_resets = 2
rail_reset_wait = 0.5




[exttrig]

# single series max time in seconds(s) or minutes (m)
series_max_time = 1m

# SQUID rail guard (see pytesdaq/utils/rail_guard.py):
# before/after each series, reset SQUIDs (PCS102 remote)
# if any channel |baseline| > rail_fraction x voltage range
rail_guard = true
rail_fraction = 0.75
rail_nb_traces = 10
rail_max_resets = 2
rail_reset_wait = 0.5


# trace length in millisec (ms) or  seconds (s)
# Alternatively use "nb_samples"
trace_length = 50ms

# sample rate
sample_rate = 1250000

# voltage min/max
voltage_min = -5
voltage_max = 5




[didv]

# tes bias list (if not current bias)
# Example:

#If not in uA, values are assumed to be in mV
bias_in_ua = false

tes_bias_list = 1000,750,500,250,125, current
#relock_first_step = False
#relock_all_steps = False

# TES bias ramp: soft transition between bias points to avoid SQUID jumps
# (equal increments no larger than tes_bias_ramp_step, same unit as
#  tes_bias_list, waiting tes_bias_ramp_step_time seconds between increments)
# The first point of tes_bias_list is set directly, without ramp.
use_tes_bias_ramp = true
tes_bias_ramp_step = 10
tes_bias_ramp_step_time = 0.1

# sample rate [Hz]
sample_rate = 1250000

# number of cycles test signal -> trace length
nb_cycles = 2.1

# voltage range (volts)
voltage_min = -5
voltage_max = 5

# Signal generator voltage/frequency (optional)
#
# Parameters: signal_gen_voltage_mV, signal_gen_frequency_Hz
# If commented, current settings are used 
#
# Syntax (for both frequency and voltage)
#
#   signal_gen_frequency_Hz = 50
#   signal_gen_voltage_mV = 20
#
#   or if different voltage/frequency between channels (-> different runs)
#
#   signal_gen_frequency_Hz  = chan1:50, chan2:50, chan3&chan4:80
#   signal_gen_voltage_mV = chan1:0.5, chan2:1, chan3&chan4:0.75 
#
# IMPORT NOTE: frequency/voltage need to have same format!

signal_gen_voltage_mV = 10
signal_gen_frequency_Hz =  50




[iv] 


#If not in uA, values are assumed to be in mV
bias_in_ua = false

# tes bias
#tes_bias_list = 140,135,130,current
tes_bias_list = 1000,750,500,250,125, current

# relock (either once or all steps)
relock_first_step = False
relock_all_steps  = False

# TES bias ramp: soft transition between bias points to avoid SQUID jumps
# (equal increments no larger than tes_bias_ramp_step, same unit as
#  tes_bias_list, waiting tes_bias_ramp_step_time seconds between increments)
# The first point of tes_bias_list is set directly, without ramp.
use_tes_bias_ramp = true
tes_bias_ramp_step = 10
tes_bias_ramp_step_time = 0.1


# trace length in millisec (ms) or  seconds (s)
# Alternatively use "nb_samples"
trace_length = 20ms

# sample rate
sample_rate = 1250000

# voltage min/max
voltage_min = -5
voltage_max = 5


[calibration]

# add noise on top of calib
add_calib_noise = False
calib_noise_run_time = 0.5m


# -----------
# laser setup
# -----------
#   - offset/voltage [V], voltage = [pp, high, or low]
#   - pulse width [s]
#   - frequency [Hz]
#   - phase = 0 hard coded
control_channel = 1
control_offset = 0
control_voltage_high = 4.2
control_voltage_low = 0
# control_pulse_width = 1.85e-6
control_pulse_width = 0.2e-6
control_frequency = 10

# TTL (set ttl_channel = None is no TTL)
# frequency same as control
ttl_channel = None
ttl_offset = 0
ttl_voltage_high = 5
ttl_voltage_low = 0
ttl_pulse_width = 5e-6

# Add TTL channel to raw data
# leave commented if not saved in data
# ttl_adc_channel = 4
# ttl_adc_id = adc1

# ---------
# DAQ setup
# ---------
# trigger mode:
#   continuous: stream continuously (default)
#   exttrig: one trace per external trigger on DAQ input
#            ("trigger_channel" in setup.ini, e.g. pfi0)
#            -> connect laser signal generator SYNC out
#               (rear panel, control_channel), enabled
#               automatically (Rigol DG800 / M81)
#            -> trace_length must be < 1/control_frequency
# calibration noise (add_calib_noise) always continuous
#
# SYNC polarity (exttrig only): positive or negative
#   SYNC level and width are fixed by the hardware (TTL):
#   ttl_* settings above apply to "ttl_channel" only, not SYNC
sync_polarity = positive
trigger_mode = exttrig

trace_length = 20ms

# sample rate
sample_rate = 1250000

# voltage min/max
voltage_min = -5
voltage_max = 5
