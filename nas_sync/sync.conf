# NAS mount + raw data sync settings (all in one place)
#
# Copies  SOURCE_DIR/<SYNC_PATTERN>  ->  DEST_DIR/<SYNC_PATTERN>
# e.g. /home/ldmdaq/tes_tools/data/run22/raw -> /mnt/synology/Data/run22/raw
#
# Applying changes:
#   [sync]   read at every sync -> next sync, nothing to run
#   [timer]  sudo bash nas_sync/install.sh sync
#   [mount]  sudo bash nas_sync/install.sh mount

# ---- [sync] what is copied ----
# local data directory (= data_path in setup.ini)
SOURCE_DIR=/home/ldmdaq/tes_tools/data

# destination directory, must be inside NAS_MOUNT
DEST_DIR=/mnt/synology/Data

# directories copied, relative to SOURCE_DIR (space separated globs),
# e.g. "run*/raw" (raw data only), "run*" (everything), "run22/raw"
SYNC_PATTERN="run*/raw"

# skip files modified in the last MIN_AGE minutes (being written)
MIN_AGE=2

# ALL OF THE BELOW PARAMETERS REQUIRE RE-INSTALL
# ---- [timer] when copies happen ----

# interval between syncs, first sync after boot
# (systemd time spans: 30s, 10min, 1h, 1h30min, ...)
SYNC_INTERVAL=10min
BOOT_DELAY=5min

# ---- [mount] NAS (/etc/fstab) ----

NAS_SHARE=//172.28.197.210/Phase_0_CryoLab_Data
NAS_MOUNT=/mnt/synology
# default username when install.sh creates ~/.smbcredentials
NAS_USER=kcl-admin
